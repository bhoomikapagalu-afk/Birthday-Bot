name: Nightly Birthday Countdown Email

on:
  schedule:
    # 30 18 UTC = 00:00 IST (midnight, India Standard Time)
    # Adjust this if you're in a different timezone.
    - cron: '30 18 * * *'
  workflow_dispatch: {}   # lets you manually trigger a test run from the Actions tab

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send countdown email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GUESS_PAGE_URL: ${{ secrets.GUESS_PAGE_URL }}
        run: python send_email.py
